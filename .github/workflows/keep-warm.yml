name: Keep API warm

# Render's free instances sleep after 15 minutes without traffic and take about a minute (plus model loading)
# to wake. Pinging /health every 10 minutes keeps the API ready for exams. One always-on free service uses
# ~744 of the 750 free instance hours a month.
# Set the repository variable API_HEALTH_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://guardai-api.onrender.com/health. Without it this workflow does nothing.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 20 "$URL" > /dev/null
