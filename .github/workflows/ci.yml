name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-mediapipe.txt
      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Test
        run: pytest -q

  backend-image:
    name: Backend · Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: guardai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrations + models load)
        run: |
          docker run -d --name api -p 8000:8000 -e DEV_AUTH=true guardai-api:ci
          for i in $(seq 1 60); do
            if curl -fs localhost:8000/health | grep -q '"ready":true'; then break; fi
            sleep 2
          done
          curl -fs localhost:8000/health
          curl -fs localhost:8000/health | grep -q '"ready":true'
          docker logs api | tail -20

  frontend:
    name: Frontend · lint, types & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-web-vecel
    env:
      # Build-time placeholders only; real keys live in Vercel.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: main-web-vecel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
